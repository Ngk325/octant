# The guard rail the repo never had: typecheck, lint, tests and a build on
# every push and PR. Every failure mode here was previously "someone forgot
# to run it" — the docs drifted for eighteen commits because nothing watched.
#
# Node 22, matching what Wrangler 4 requires and what Vite 8 / Vitest 4 will
# need, so the toolchain upgrades change no CI plumbing.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint --if-present
      - run: npm test
      - run: npm run build
