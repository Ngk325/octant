<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Octant — read the wiring</title>
    <meta name="description" content="Learn how personality actually works, step by step and in plain language: sixteen wirings, four sides of the mind, and 256 derived relations." />
    <meta name="color-scheme" content="light dark" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..500&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <script>
      // Resolve the theme before first paint, so there is no flash of the wrong
      // canvas. data-theme is ALWAYS set — the stylesheet declares the dark
      // palette once, under [data-theme="dark"], with no prefers-color-scheme
      // duplicate to drift out of sync.
      // The "stratfield." fallback is the pre-rename key; src/storage.ts does the
      // same migration for every other key, so nobody loses their settings.
      try {
        var t = localStorage.getItem("octant.theme") || localStorage.getItem("stratfield.theme");
        if (t !== "light" && t !== "dark") {
          t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.dataset.theme = t;
      } catch (e) {
        document.documentElement.dataset.theme = "light";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
